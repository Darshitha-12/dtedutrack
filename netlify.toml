# Netlify deploy configuration (free plan, no credit card required).
#
# This file only affects Netlify builds/deploys; Vercel and the offline APK
# export ignore it entirely.
#
# The Next.js Runtime (@netlify/plugin-nextjs) turns the App Router pages, the
# API routes under src/app/api and middleware.ts into Netlify Functions, which
# is what makes login, Messages and the WebRTC call signalling work here.

[build]
  # TEMP DIAGNOSTIC: capture the build log and ship it to ntfy when the build
  # fails (Netlify's log API returns 404 for this site). Revert to plain
  # "npm run build" once the failure is understood.
  command = "node scripts/ci-build.mjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# TEMP DIAGNOSTIC: reports build lifecycle + onError payload to ntfy.
# Remove this block and the tools/netlify-diag directory once done.
[[plugins]]
  package = "./tools/netlify-diag"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The phone app talks to these API routes constantly (chat polling + call
# signalling), so keep them out of the CDN cache and let them run every time.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
