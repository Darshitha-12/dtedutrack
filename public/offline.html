<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BioPulse — Offline</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030F0C;
      color: #e5f5ee;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 380px; }
    .logo { font-size: 56px; }
    h1 { margin: 16px 0 8px; font-size: 22px; }
    p { margin: 0; color: #9fb9ae; line-height: 1.6; }
    button {
      margin-top: 20px; padding: 12px 22px; border: 0; border-radius: 10px;
      background: #2dd4bf; color: #05231d; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🧬</div>
    <h1>BioPulse</h1>
    <p>You're offline right now. Pages you have already opened still work. Reconnect to load new ones.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>
    // Coming back online should take the user straight to the app, not this screen.
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
