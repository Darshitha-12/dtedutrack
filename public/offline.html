<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BioPulse — Offline</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030F0C;
      color: #e5f5ee;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 380px; }
    .logo { font-size: 56px; }
    h1 { margin: 16px 0 8px; font-size: 22px; }
    p { margin: 0; color: #9fb9ae; line-height: 1.6; }
    button {
      margin-top: 20px; padding: 12px 22px; border: 0; border-radius: 10px;
      background: #2dd4bf; color: #05231d; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🧬</div>
    <h1>BioPulse</h1>
    <p>You're offline right now. Pages you have already opened still work. Reconnect to load new ones.</p>
    <button type="button" onclick="recover()">Try again</button>
  </div>
  <script>
    // Recover from a stale worker/cache that is pinning the tab to this screen: drop the
    // service worker and every cache, then reload straight from the network. A plain
    // location.reload() would just be answered by the same broken worker again.
    var recovering = false;
    function recover() {
      if (recovering) return;
      recovering = true;
      var done = function () { location.reload(); };
      try {
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if (window.caches) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
          }).then(done, done);
          return;
        }
      } catch (e) { /* fall through to a plain reload */ }
      done();
    }
    // Coming back online should take the user straight to the app, not this screen.
    window.addEventListener("online", recover);
  </script>
</body>
</html>
